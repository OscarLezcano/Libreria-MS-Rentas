# cSpell:disable
# Propiedades de test: sombrean a src/main/resources/application.properties.
# El import es opcional: si existe private.properties se usan las credenciales
# reales (necesarias para los tests gated con sales.test.full=true), y si no
# existe los tests de slice igual cargan porque el import no falla.

# Imports
spring.config.import=optional:classpath:config/private.properties,optional:classpath:config/private.properties.example

# Configuraciones de la aplicacion
spring.application.name=sales-service
server.port=${sales.server.port:8082}

# Swagger / OpenAPI (habilitado por defecto; override via sales.api-docs.enabled)
springdoc.api-docs.enabled=${sales.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase deshabilitado en los tests de slice (no hay BD en CI)
spring.liquibase.enabled=false

# Cache: valida el binding sin requerir un Redis real en los tests de slice.
spring.cache.type=redis
spring.data.redis.url=redis://localhost:6379
spring.data.redis.ssl.enabled=false
sales.cache.key-prefix=bigobooks:v1:sales:
sales.cache.ttl.orders=10m
sales.cache.ttl.coupons=30m
sales.cache.ttl.promotions=15m

# Seguridad tests
jwt.secret=cambia-este-secreto-de-desarrollo-para-HS512-0123456789abcdef01
jwt.expiration-minutes=120
security.jwt.allow-cookie=false
security.jwt.role-claim=role
security.jwt.authority-prefix=ROLE_
security.public-paths=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
security.roles.orders-view=ADMIN,SELLER,WAREHOUSE,READER
security.roles.orders-manage=ADMIN,SELLER
security.roles.orders-status=ADMIN,SELLER,WAREHOUSE
security.roles.orders-delete=ADMIN
security.roles.coupons-view=ADMIN,SELLER,WAREHOUSE,READER
security.roles.coupons-manage=ADMIN,SELLER
security.roles.coupons-delete=ADMIN
security.roles.promotions-view=ADMIN,SELLER,WAREHOUSE,READER
security.roles.promotions-manage=ADMIN
security.roles.promotions-delete=ADMIN

# Permitir override de beans en tests
spring.main.allow-bean-definition-overriding=true

# Logs (configurables: rutas y niveles)
sales.log.path=logs
sales.log.file=sales-service.log
sales.log.level.com.bigobooks=INFO
sales.log.level.cache=INFO
sales.log.level.security=DEBUG
sales.log.level.repositories=DEBUG
sales.log.level.sql=DEBUG
